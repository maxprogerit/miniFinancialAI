services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: minifinancial-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: financialdb
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Postgres only runs files here on a brand-new (empty) data directory -
      # this is what actually creates the schema + demo users/transactions
      # on a clean `docker compose up`, not something run by the app.
      - ./app/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: minifinancial-api
    env_file: .env
    environment:
      # Inside the Docker network the DB is reachable at the "postgres"
      # service name on its container port (5432), not localhost:5434 -
      # that host-side mapping is only for connecting from outside Docker.
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/financialdb
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # No curl in python:3.12-slim - using Python itself avoids an extra
      # apt-get layer just for a healthcheck.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
